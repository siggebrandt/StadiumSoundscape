<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Mask som bestämmer vad som ska visas (vitt) och vad som ska vara genomskinligt (svart) -->
    <mask id="cutout">
      <!-- Vit bakgrund gör hela cirkeln synlig som standard -->
      <rect width="100" height="100" fill="white" />
      
      <!-- Svarta linjer klipper ut mönstret och gör det genomskinligt -->
      <g stroke="black" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <!-- Mittenpentagonen -->
        <polygon points="50,65 64,55 59,38 41,38 36,55" fill="none" />
        
        <!-- Linjer ut från mitten -->
        <line x1="50" y1="65" x2="50" y2="85" />
        <line x1="64" y1="55" x2="82" y2="61" />
        <line x1="59" y1="38" x2="71" y2="22" />
        <line x1="41" y1="38" x2="29" y2="22" />
        <line x1="36" y1="55" x2="18" y2="61" />

        <!-- Yttre linjer för att stänga mönstret mot kanten -->
        <path d="M50 85 l15 9 M50 85 l-15 9" />
        <path d="M82 61 l10 -11 M82 61 l6 13" />
        <path d="M71 22 l15 -2 M71 22 l-4 -15" />
        <path d="M29 22 l-15 -2 M29 22 l4 -15" />
        <path d="M18 61 l-10 -11 M18 61 l-6 13" />
      </g>
    </mask>
  </defs>

  <!-- En mjukt röd cirkel där mönstret från masken klipps ut -->
  <circle cx="50" cy="50" r="45" fill="#E63946" mask="url(#cutout)" />
</svg>